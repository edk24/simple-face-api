services:
  api:
    platform: linux/amd64
    build:
      context: .
    container_name: rmtpt-face-api
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
      - ./data:/app/data
      - insightface_models:/root/.insightface/models
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
volumes:
  insightface_models: